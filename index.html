<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beatriz Diniz Rodrigues | Psicóloga e Psicanalista</title>
    <link rel="icon" href="./images/marca/favicon.png" type="image/png" />
    <meta
      name="description"
      content="Beatriz Diniz Rodrigues — Psicóloga e Psicanalista. Atendimento clínico online e presencial em Belo Horizonte/MG."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Laila:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- ===================== CABEÇALHO ===================== -->
    <header class="site-header" id="topo">
      <div class="container header-inner">
        <a class="brand" href="#topo" aria-label="Página inicial">
          <img id="logo-cabecalho" class="brand-logo" src="" alt="Beatriz Diniz Rodrigues — Psicóloga e Psicanalista" />
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a href="#sobre-mim">Sobre mim</a>
          <a href="#atendimentos">Atendimentos</a>
          <a href="#contato">Contato</a>
        </nav>
        <a id="cta-topo" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">
          Agende sua consulta
        </a>
      </div>
    </header>

    <main>
      <!-- ===================== HERO ===================== -->
      <section class="hero" id="inicio">
        <div class="container hero-inner">
          <figure class="hero-photo">
            <img id="foto-hero" src="" alt="Beatriz Diniz Rodrigues" />
          </figure>
          <div class="hero-text">
            <p id="frase-efeito" class="hero-quote"></p>
          </div>
        </div>
      </section>

      <!-- ===================== SOBRE MIM ===================== -->
      <section class="section sobre-mim" id="sobre-mim">
        <div class="container">
          <div class="card card--split">
            <div class="card-text">
              <h2 id="titulo-sobre-mim" class="section-title"></h2>
              <ul id="lista-sobre-mim" class="topicos" aria-label="Formação e atuação"></ul>
            </div>
            <figure class="card-foto">
              <img id="foto-sobre-mim" src="" alt="Beatriz segurando um livro de Freud" />
            </figure>
          </div>
        </div>
      </section>

      <!-- ===================== MEU PROPÓSITO ===================== -->
      <section class="section secao-centrada" id="meu-proposito">
        <div class="container narrow">
          <h2 id="titulo-meu-proposito" class="section-title section-title--center"></h2>
          <div id="texto-meu-proposito" class="texto-corpo texto-corpo--center"></div>
        </div>
      </section>

      <!-- ============ COMO ASSIM PSICANÁLISE? / É PARA MIM? ============ -->
      <section class="bloco-psica" id="psicanalise">
        <div class="bloco-psica__faixa">
          <div class="container">
            <div class="bloco-psica__faixa-texto">
              <h2 id="titulo-como-assim" class="section-title section-title--claro"></h2>
              <div id="texto-como-assim" class="texto-corpo texto-corpo--claro"></div>
            </div>
          </div>
        </div>
        <div class="bloco-psica__base">
          <div class="container bloco-psica__grid">
            <figure class="bloco-psica__foto">
              <img id="foto-como-assim" src="" alt="Beatriz lendo em uma biblioteca" />
            </figure>
            <div class="bloco-psica__terapia" id="terapia">
              <h2 id="titulo-terapia" class="section-title"></h2>
              <div id="texto-terapia" class="texto-corpo"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===================== SOBRE AS SESSÕES ===================== -->
      <section class="section sessoes" id="sessoes">
        <div class="container">
          <div class="card card--split card--reverse">
            <div class="card-text">
              <h2 id="titulo-sessoes" class="section-title"></h2>
              <div id="texto-sessoes" class="texto-corpo"></div>
            </div>
            <figure class="card-foto">
              <img id="foto-sessoes" src="" alt="Beatriz lendo próxima à janela" />
            </figure>
          </div>
        </div>
      </section>

      <!-- ===================== CONVERSA INICIAL ===================== -->
      <section class="section secao-centrada" id="conversa">
        <div class="container narrow">
          <h2 id="titulo-conversa" class="section-title section-title--center"></h2>
          <div id="texto-conversa" class="texto-corpo texto-corpo--center"></div>
        </div>
      </section>

      <!-- ===================== DÚVIDAS COMUNS ===================== -->
      <section class="section secao-centrada" id="duvidas">
        <div class="container narrow">
          <h2 id="titulo-duvidas" class="section-title section-title--center"></h2>
          <div id="texto-duvidas-intro" class="texto-corpo texto-corpo--center"></div>
          <div id="lista-duvidas" class="accordion"></div>
        </div>
      </section>

      <!-- ===================== ATENDIMENTOS ===================== -->
      <section class="section atendimentos" id="atendimentos">
        <div class="container">
          <h2 id="titulo-atendimentos" class="section-title section-title--center"></h2>
          <div id="cards-atendimento" class="cards-atendimento"></div>

          <div class="contato-row" id="contato">
            <div class="contato-card">
              <span class="pill-label">Contato</span>
              <div class="contato-card__info">
                <span id="contato-helper"></span>
                <strong id="contato-numero"></strong>
              </div>
            </div>
            <a id="cta-contato" class="btn btn-primary btn-lg" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>

          <div class="endereco-row">
            <div class="endereco-card">
              <span class="pill-label" id="endereco-rotulo"></span>
              <p id="endereco-texto"></p>
            </div>
            <div class="mapa">
              <iframe
                id="mapa-iframe"
                title="Mapa do consultório"
                loading="lazy"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
              ></iframe>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ===================== RODAPÉ ===================== -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <img id="logo-rodape" class="footer-logo" src="" alt="Beatriz Diniz Rodrigues — Psicóloga e Psicanalista" />
        <p class="footer-copy">&copy; <span id="ano-atual"></span>. Todos os direitos reservados.</p>
      </div>
    </footer>

    <script src="./config.js"></script>
    <script src="./script.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K2BW4QNWK8">
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K2BW4QNWK8');
    </script>
  </body>
</html>
